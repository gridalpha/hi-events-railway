; Web role: nginx on Railway's $PORT, php-fpm behind it, and the SSR frontend.
; The queue worker and the scheduler live in their own Railway service.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

[program:nodejs]
command=yarn start
directory=/app/frontend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
; supervisord passes its own environment to every child, so each VITE_* service
; variable reaches the SSR server — and the server injects them into the page at
; request time as window.hievents, which is what makes them runtime config
; rather than baked-in build config. Only these three are overridden here:
; VITE_API_URL_SERVER is the SSR server calling the API back through the
; container's own nginx, which must be a loopback address rather than the
; public domain.
environment=NODE_ENV="production",NODE_PORT="5678",VITE_API_URL_SERVER="http://127.0.0.1:%(ENV_PORT)s/api"
