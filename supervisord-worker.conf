; Worker role: the Laravel queue worker plus the scheduler, and a small
; liveness server on $PORT so Railway's health check is a real one rather than
; a status badge that stays green while the worker crash-loops.
;
; Ship this service at ONE replica: the scheduler has no leader election, so a
; second copy duplicates every scheduled job.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:laravel-queue-worker]
command=php /app/backend/artisan queue:work --queue=default,webhook-queue --sleep=3 --tries=3 --timeout=60 --max-time=3600
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

[program:laravel-scheduler]
command=/bin/sh -c "while true; do php /app/backend/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

; PHP's built-in server is dual-stack on [::], so Railway's IPv4 prober reaches
; it. It serves one request at a time, which is all a health check needs.
[program:health]
command=php -S [::]:%(ENV_PORT)s -t /railway/health-root /railway/worker-health.php
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
