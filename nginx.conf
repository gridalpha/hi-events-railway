events {}

http {
    # Only send Connection: upgrade for requests that actually ask for it.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # __PORT__ is substituted by /railway/entrypoint.sh from Railway's $PORT.
        listen __PORT__;
        listen [::]:__PORT__;
        server_name _;

        root /app/backend/public;

        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        index index.html index.htm index.php;
        charset utf-8;

        access_log /dev/stdout;
        error_log /dev/stderr;

        # Railway's health prober. Dot- and hyphen-free so healthcheckPath
        # accepts it, anonymous, and it opens the app's own configured
        # Postgres and Redis connections, so it fails when a dependency does.
        location = /healthz {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/backend/public/healthz.php;
            fastcgi_param SCRIPT_NAME /healthz.php;
            fastcgi_pass 127.0.0.1:9000;
            access_log off;
        }

        location /storage {
            alias /app/backend/storage/app/public;
            access_log off;
            expires max;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff";
        }

        location ^~ /api/ {
            rewrite ^/api(/.*)$ /index.php$1 break;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REQUEST_URI $1;
            fastcgi_pass 127.0.0.1:9000;
            client_max_body_size 50M;
            fastcgi_read_timeout 120s;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param PHP_VALUE "error_log=/dev/stderr";
        }

        location / {
            # The SSR frontend. 127.0.0.1 rather than `localhost`: the node
            # server binds both families, but addressing the literal avoids
            # nginx retrying a dead peer for a fail_timeout window while the
            # process is still starting.
            proxy_pass http://127.0.0.1:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            client_max_body_size 50M;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
